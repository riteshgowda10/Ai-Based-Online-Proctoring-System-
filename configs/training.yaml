# ExamGuard AI (PRJ 137) - Model Training Configuration
# Reproducible hyperparameter and environment specifications

experiment:
  name: "proctoring_yolov8n_baseline"
  seed: 42
  device: "cpu" # "0" for GPU, "cpu" for CPU fallback
  output_dir: "models/object_detection"

object_detection:
  base_model: "models/yolov8n.pt"
  dataset_yaml: "ml/object_detection/dataset.yaml"
  epochs: 10
  batch_size: 8
  image_size: 640
  learning_rate: 0.005
  momentum: 0.937
  weight_decay: 0.0005
  optimizer: "SGD" # Options: SGD, Adam, AdamW
  warmup_epochs: 2.0
  patience: 10
  save_period: -1 # Only save best and last
  workers: 2

augmentation:
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  degrees: 5.0
  translate: 0.08
  scale: 0.15
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.5
  mixup: 0.0

export:
  format: "torchscript" # Options: onnx, torchscript, engine
  optimize: true
